apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.chaquo.python"

def chaquopyBuildPython = System.getenv("CHAQUOPY_BUILD_PYTHON")
        ?: "C:\\Users\\jdmou\\AppData\\Roaming\\uv\\python\\cpython-3.11.15-windows-x86_64-none\\python.exe"

android {
    namespace "com.moutrancorp.memspike"
    compileSdk 35

    defaultConfig {
        applicationId "com.moutrancorp.memspike"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "0.2.0-compose-shell"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    chaquopy {
        defaultConfig {
            version = "3.11"
            buildPython chaquopyBuildPython
            pip {
                install "yt-dlp==2026.6.9"
            }
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.9.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.4"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
