apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.kapt"
apply plugin: "com.chaquo.python"

def chaquopyBuildPython = System.getenv("CHAQUOPY_BUILD_PYTHON")
        ?: "C:\\Users\\jdmou\\AppData\\Roaming\\uv\\python\\cpython-3.11.15-windows-x86_64-none\\python.exe"

android {
    namespace "com.moutrancorp.memspike"
    compileSdk 35

    defaultConfig {
        applicationId "com.moutrancorp.memspike"
        minSdk 24
        targetSdk 35
        versionCode 42
        versionName "0.3.38-agent-memory-tools"

        ndk {
            abiFilters "arm64-v8a"
        }

    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    chaquopy {
        defaultConfig {
            version = "3.11"
            buildPython chaquopyBuildPython
            pip {
                install "yt-dlp==2026.6.9"
                install "pypdf==6.14.2"
            }
        }
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.activity:activity-compose:1.9.1"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.4"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "io.coil-kt:coil-compose:2.7.0"
    kapt "androidx.room:room-compiler:2.6.1"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}
